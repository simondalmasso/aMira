name: Deploy UI Truthfulness v1

on:
  workflow_dispatch:
    inputs:
      DEPLOY_UI_TRUTHFULNESS_V1:
        description: 'Type the literal string DEPLOY_UI_TRUTHFULNESS_V1 to confirm deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-ui-truthfulness-v1
  cancel-in-progress: false

env:
  EXPECTED_INPUT: DEPLOY_UI_TRUTHFULNESS_V1
  DEPLOY_SHA: 68be3495ed35a4081dfa4fcec32fbcb06a6a0743
  BASE_URL: https://santaninverter-oracle.simondalmasso44.workers.dev

jobs:
  deploy:
    name: Deploy sanitized UI truthfulness candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Verify explicit dispatch token
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.DEPLOY_UI_TRUTHFULNESS_V1 }}" != "$EXPECTED_INPUT" ]; then
            echo "::error::Confirmation input did not match DEPLOY_UI_TRUTHFULNESS_V1."
            exit 1
          fi

      - name: Checkout pinned sanitized candidate
        uses: actions/checkout@v4
        with:
          ref: 68be3495ed35a4081dfa4fcec32fbcb06a6a0743
          fetch-depth: 0

      - name: Verify checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$DEPLOY_SHA"
          echo "Checkout SHA verified: $ACTUAL_SHA"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused UI truthfulness tests
        run: node scripts/ui-truthfulness-tests.mjs

      - name: TypeScript check against validated baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-evidence

          set +e
          TSC_OUTPUT="$(bunx tsc --noEmit 2>&1)"
          TSC_STATUS=$?
          set -e

          printf '%s\n' "$TSC_OUTPUT" > deployment-evidence/tsc-output.txt

          TSC_ERROR_COUNT="$(
            printf '%s\n' "$TSC_OUTPUT" |
            grep -cE 'error TS[0-9]+:' || true
          )"

          echo "TypeScript exit status: $TSC_STATUS"
          echo "TypeScript error count: $TSC_ERROR_COUNT"

          if [ "$TSC_ERROR_COUNT" -ne 86 ]; then
            echo "::error::TypeScript diagnostic count changed from validated baseline 86 to $TSC_ERROR_COUNT."
            exit 1
          fi

      - name: Build with OpenNext for Cloudflare
        run: bunx opennextjs-cloudflare build

      - name: Wrap worker with cron
        run: node scripts/wrap-worker-with-cron.mjs

      - name: Validate canonical Wrangler configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f ./wrangler.jsonc
          test -f ./.open-next/worker-with-cron.js
          test -d ./.open-next/assets

          jq -e '
            .name == "santaninverter-oracle" and
            .main == ".open-next/worker-with-cron.js" and
            .assets.binding == "ASSETS" and
            .assets.directory == ".open-next/assets" and
            .compatibility_date == "2026-06-16" and
            .triggers.crons == ["0 23 * * 1-5"] and
            ([.kv_namespaces[].binding] | sort) == (["ORACLE_ASSETS_HISTORY", "ORACLE_FCI_HISTORY", "ORACLE_PREDICTIONS"] | sort) and
            ([.services[].binding] | index("MACRO_PROXY")) != null
          ' ./wrangler.jsonc >/dev/null

      - name: Record active Cloudflare deployment before deploy
        id: previous_version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-evidence

          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          WORKER_NAME="$(jq -er '.name' ./wrangler.jsonc)"
          API_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments"

          DEPLOYMENTS_JSON="$(
            curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API_URL"
          )"

          printf '%s\n' "$DEPLOYMENTS_JSON" | jq -e '.success == true' >/dev/null

          LATEST_DEPLOYMENT="$(
            printf '%s\n' "$DEPLOYMENTS_JSON" |
            jq -cer '
              .result.deployments as $items
              | if ($items | length) == 0 then
                  error("No existing Cloudflare deployment found")
                elif $items[0].created_on? != null then
                  ($items | max_by(.created_on))
                else
                  $items[0]
                end
            '
          )"

          PREVIOUS_DEPLOYMENT_ID="$(
            printf '%s\n' "$LATEST_DEPLOYMENT" | jq -er '.id'
          )"

          PREVIOUS_VERSION_ID="$(
            printf '%s\n' "$LATEST_DEPLOYMENT" |
            jq -er '
              .versions
              | ((map(select((.percentage | tonumber) == 100)) | first)
                 // max_by(.percentage | tonumber))
              | .version_id
            '
          )"

          test -n "$PREVIOUS_DEPLOYMENT_ID"
          test -n "$PREVIOUS_VERSION_ID"

          echo "previous_deployment_id=$PREVIOUS_DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "previous_version_id=$PREVIOUS_VERSION_ID" >> "$GITHUB_OUTPUT"

          jq -n \
            --arg deployment_id "$PREVIOUS_DEPLOYMENT_ID" \
            --arg version_id "$PREVIOUS_VERSION_ID" \
            '{previous_deployment_id: $deployment_id, previous_version_id: $version_id}' \
            > deployment-evidence/pre-deploy-cloudflare.json

          echo "Rollback target captured."

      - name: Deploy to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo "attempted=true" >> "$GITHUB_OUTPUT"

          bunx wrangler deploy --config ./wrangler.jsonc

          WORKER_NAME="$(jq -er '.name' ./wrangler.jsonc)"
          API_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments"

          DEPLOYMENTS_JSON="$(
            curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API_URL"
          )"

          printf '%s\n' "$DEPLOYMENTS_JSON" | jq -e '.success == true' >/dev/null

          LATEST_DEPLOYMENT="$(
            printf '%s\n' "$DEPLOYMENTS_JSON" |
            jq -cer '
              .result.deployments as $items
              | if ($items | length) == 0 then
                  error("No Cloudflare deployment found after deploy")
                elif $items[0].created_on? != null then
                  ($items | max_by(.created_on))
                else
                  $items[0]
                end
            '
          )"

          NEW_DEPLOYMENT_ID="$(printf '%s\n' "$LATEST_DEPLOYMENT" | jq -er '.id')"
          NEW_VERSION_ID="$(
            printf '%s\n' "$LATEST_DEPLOYMENT" |
            jq -er '.versions | max_by(.percentage | tonumber) | .version_id'
          )"

          test -n "$NEW_DEPLOYMENT_ID"
          test -n "$NEW_VERSION_ID"

          if [ "$NEW_DEPLOYMENT_ID" = "${{ steps.previous_version.outputs.previous_deployment_id }}" ]; then
            echo "::error::Cloudflare deployment ID did not change."
            exit 1
          fi

          echo "deployed_deployment_id=$NEW_DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "deployed_version_id=$NEW_VERSION_ID" >> "$GITHUB_OUTPUT"

          jq -n \
            --arg deployment_id "$NEW_DEPLOYMENT_ID" \
            --arg version_id "$NEW_VERSION_ID" \
            '{deployed_deployment_id: $deployment_id, deployed_version_id: $version_id}' \
            > deployment-evidence/post-deploy-cloudflare.json

      - name: Smoke production GET endpoints and JavaScript asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-evidence
          ROOT_HTML="deployment-evidence/root.html"
          : > deployment-evidence/smoke.txt

          echo "GET $BASE_URL/" | tee -a deployment-evidence/smoke.txt
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors \
            "$BASE_URL/" \
            -o "$ROOT_HTML"

          for PATHNAME in "/api/macro" "/api/oracle/rankings"; do
            echo "GET $BASE_URL$PATHNAME" | tee -a deployment-evidence/smoke.txt
            OUTPUT_FILE="deployment-evidence/$(printf '%s' "$PATHNAME" | tr '/' '_' | sed 's/^_//').json"
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors \
              "$BASE_URL$PATHNAME" \
              -o "$OUTPUT_FILE"
            jq -e . "$OUTPUT_FILE" >/dev/null
          done

          JS_PATH="$(
            grep -oE 'src="[^"]+\.js[^"]*"' "$ROOT_HTML" |
            head -n 1 |
            cut -d'"' -f2
          )"

          test -n "$JS_PATH"

          case "$JS_PATH" in
            http://*|https://*) JS_URL="$JS_PATH" ;;
            /*) JS_URL="$BASE_URL$JS_PATH" ;;
            *) JS_URL="$BASE_URL/$JS_PATH" ;;
          esac

          echo "GET $JS_URL" | tee -a deployment-evidence/smoke.txt
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors \
            "$JS_URL" \
            -o /dev/null

      - name: Rollback to previous Cloudflare version on deploy or smoke failure
        if: ${{ failure() && steps.deploy.outputs.attempted == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          PREVIOUS_VERSION_ID="${{ steps.previous_version.outputs.previous_version_id }}"
          test -n "$PREVIOUS_VERSION_ID"

          WORKER_NAME="$(jq -er '.name' ./wrangler.jsonc)"
          API_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments"

          PAYLOAD="$(
            jq -nc \
              --arg version_id "$PREVIOUS_VERSION_ID" \
              '{
                strategy: "percentage",
                versions: [{percentage: 100, version_id: $version_id}],
                annotations: {
                  "workers/message": "Automated rollback after UI truthfulness deployment failure",
                  "workers/triggered_by": "deployment"
                }
              }'
          )"

          RESPONSE="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$PAYLOAD" \
              "$API_URL"
          )"

          printf '%s\n' "$RESPONSE" | jq -e '.success == true' >/dev/null
          sleep 2

          VERIFY_JSON="$(
            curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API_URL"
          )"

          RESTORED_VERSION_ID="$(
            printf '%s\n' "$VERIFY_JSON" |
            jq -er '
              .result.deployments as $items
              | (if $items[0].created_on? != null then
                   ($items | max_by(.created_on))
                 else
                   $items[0]
                 end)
              | .versions
              | max_by(.percentage | tonumber)
              | .version_id
            '
          )"

          test "$RESTORED_VERSION_ID" = "$PREVIOUS_VERSION_ID"
          echo "Rollback restored version: $RESTORED_VERSION_ID"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-truthfulness-deployment-evidence
          path: deployment-evidence/
          if-no-files-found: warn
