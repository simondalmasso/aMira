name: Order2 Patch Bootstrap

on:
  push:
    branches:
      - chore/order2-patch-bootstrap-20260807

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: feat/oraculo-santander-completion-sol
      EXPECTED_OLD_SHA: 753cf2d72220e96e5a675a17dddc5cfa1780e081
    steps:
      - name: Checkout staging controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch exact target workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout --detach "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_OLD_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/oraculo-runtime-gate.yml')
          s=p.read_text()
          old='''          python3 -c 'import json; d=json.load(open("deployment-evidence/cron-execution.json")); assert d.get("success") is True; assert d.get("lifecycle",{}).get("storage") == "durable"; jobs=d.get("jobs",[]); assert jobs and all(j.get("ok") is True and j.get("persistence_ack",{}).get("durable") is True for j in jobs)'\n'''
          new='''          python3 - <<'PYCRON'\n          import json\n          d=json.load(open('deployment-evidence/cron-execution.json'))\n          assert d.get('success') is True\n          assert d.get('status') in ('READY','PARTIAL')\n          assert d.get('lifecycle',{}).get('storage') == 'durable'\n          jobs=d.get('jobs',[])\n          assert jobs\n          allowed={'DURABLE','NOT_APPLICABLE_NO_DATA'}\n          assert all(j.get('ok') is True and j.get('persistence_ack',{}).get('status') in allowed for j in jobs)\n          assert any(j.get('persistence_ack',{}).get('status') == 'DURABLE' for j in jobs)\n          assert not any(j.get('error_code') for j in jobs)\n          PYCRON\n'''
          if s.count(old)!=1:
              raise SystemExit(f'expected one cron assertion, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git diff --check

      - name: Commit and fast-forward target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aMira ARQ"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/oraculo-runtime-gate.yml
          git commit -m "ci(order2): accept explicit no-data cron persistence state"
          NEW_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$EXPECTED_OLD_SHA" "$NEW_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "SOURCE_SHA=$NEW_SHA" | tee /tmp/order2-workflow-result.txt

      - name: Upload workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order2-cron-gate-reconcile-${{ github.sha }}
          path: /tmp/order2-workflow-result.txt
          if-no-files-found: warn
          retention-days: 14
