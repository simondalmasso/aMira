name: Order2 Patch Bootstrap

on:
  push:
    branches:
      - chore/order2-patch-bootstrap-20260807

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: feat/oraculo-santander-completion-sol
      EXPECTED_OLD_SHA: db317d5586c3b6668b1e834776027b49842a9d94
    steps:
      - name: Checkout staging controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile docs on exact target head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout --detach "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_OLD_SHA"
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, found {s.count(old)}')
              p.write_text(s.replace(old,new))

          once(
              'docs/CURRENT_STATE.md',
              ".github/workflows/oraculo-runtime-gate.yml` is the authoritative source gate for the exact branch SHA. A successful gate triggers `.github/workflows/oraculo-production-deploy.yml`, which checks out the exact green SHA, rebuilds it, captures the Cloudflare rollback anchor, deploys with existing repository secrets, then verifies production `/`, `/api/oracle/single`, cron binding health and one idempotent cron persistence run.",
              ".github/workflows/oraculo-runtime-gate.yml` is the single authoritative Order #2 gate for the exact branch SHA. Its `production-deploy` job is dependency-bound to the strict source gate (`needs: runtime-gate`), checks out that same green SHA, rebuilds it, captures the Cloudflare rollback anchor, deploys with existing repository secrets, then verifies production `/`, `/api/oracle/single`, cron binding health and one idempotent cron persistence run. There is no second production workflow authority."
          )

          once(
              'docs/oraculo-santander-system-map.md',
              "exact branch SHA\n  -> Oraculo Runtime Gate (strict)\n  -> workflow_run success\n  -> Oraculo Production Deploy\n      -> checkout same head SHA\n      -> rebuild same tree\n      -> capture rollback anchor\n      -> wrangler deploy\n      -> Cloudflare deployment/version/100% traffic evidence\n      -> production API + cron persistence smoke",
              "exact branch SHA\n  -> Oraculo Runtime Gate / runtime-gate (strict)\n  -> production-deploy job (needs runtime-gate=success; same workflow run)\n      -> checkout same exact head SHA\n      -> rebuild same tree\n      -> capture rollback anchor\n      -> wrangler deploy\n      -> capture Cloudflare deployment/version/traffic evidence\n      -> production API + cron persistence smoke"
          )
          PY
          git diff --check

      - name: Commit and fast-forward target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aMira ARQ"
          git config user.email "actions@users.noreply.github.com"
          git add docs/CURRENT_STATE.md docs/oraculo-santander-system-map.md
          git commit -m "docs(order2): reconcile final deployment authority"
          NEW_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$EXPECTED_OLD_SHA" "$NEW_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "SOURCE_SHA=$NEW_SHA" | tee /tmp/order2-docs-result.txt

      - name: Upload documentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order2-docs-reconcile-${{ github.sha }}
          path: /tmp/order2-docs-result.txt
          if-no-files-found: warn
          retention-days: 14
