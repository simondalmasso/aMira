name: Order2 Patch Bootstrap

on:
  push:
    branches:
      - chore/order2-patch-bootstrap-20260807

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: feat/oraculo-santander-completion-sol
      EXPECTED_OLD_SHA: 20faf52e4d55aa38056724ab9f7fcd627fe27700
    steps:
      - name: Checkout staging controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair exact target head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout --detach "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_OLD_SHA"
          python3 -c "from pathlib import Path; p=Path('scripts/d-post-deploy-validation.ts'); s=p.read_text(); old=\"const checks = await Promise.all(endpoints.map(async (ep) => {\"; new=\"const checks: GateResult['checks'] = await Promise.all(endpoints.map(async (ep): Promise<GateResult['checks'][number]> => {\"; assert s.count(old)==1; p.write_text(s.replace(old,new))"
          python3 -c "from pathlib import Path; p=Path('src/lib/oracle-multi/cron.ts'); s=p.read_text(); old=\"): Promise<CronJobResult['persistence_ack']> {\"; new=\"): Promise<NonNullable<CronJobResult['persistence_ack']>> {\"; assert s.count(old)==1; p.write_text(s.replace(old,new))"
          python3 -c "from pathlib import Path; p=Path('tests/hardening/u6-kv-persistence-audit.test.ts'); s=p.read_text(); old=\"const raw = await failingKv.get<string>('any-key');\"; new=\"const raw = await failingKv.get('any-key');\"; assert s.count(old)==1; p.write_text(s.replace(old,new))"
          git diff --check
          git diff --stat

      - name: Commit and fast-forward target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aMira ARQ"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/d-post-deploy-validation.ts src/lib/oracle-multi/cron.ts tests/hardening/u6-kv-persistence-audit.test.ts
          git commit -m "fix(order2): clear remaining strict TypeScript diagnostics"
          NEW_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$EXPECTED_OLD_SHA" "$NEW_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "SOURCE_SHA=$NEW_SHA" | tee /tmp/order2-repair-result.txt

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order2-typescript-repair-${{ github.sha }}
          path: /tmp/order2-repair-result.txt
          if-no-files-found: warn
          retention-days: 14
