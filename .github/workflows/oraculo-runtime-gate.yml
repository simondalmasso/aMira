name: Oraculo Runtime Gate

on:
  push:
    branches:
      - feat/oraculo-santander-completion-sol
      - chore/amira-runtime-ci-staging-20260722
      - chore/amira-runtime-code-staging-20260722
      - chore/amira-runtime-code-staging-v2-20260722
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: write

concurrency:
  group: oraculo-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  ORDER_2_BASE_SHA: acda0aca84220c676941367b2da691e9ba69c638
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "${ORDER_2_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$ORDER_2_BASE_SHA" HEAD

      - name: Setup Node 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Initialize evidence
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/oraculo-runtime-gate"
          mkdir -p "$E"
          printf '%s\n' "$E" > "$RUNNER_TEMP/oraculo-evidence-path"
          git diff --name-only "$ORDER_2_BASE_SHA...HEAD" | sort > "$E/modified-files.txt"
          sha256sum package.json bun.lock > "$E/package-hashes-before.txt"
          {
            echo "head_sha=$(git rev-parse HEAD)"
            echo "order_2_base_sha=$ORDER_2_BASE_SHA"
            echo "event=${{ github.event_name }}"
            echo "ref=${{ github.ref }}"
            echo "node=$(node --version)"
            echo "bun=$(bun --version)"
            echo "cloudflare_accessed=false"
            echo "deploy_attempted=false"
            echo "paper_only=true"
          } > "$E/manifest.txt"

      - name: Frozen dependency installation
        run: |
          set -o pipefail
          E="$(cat "$RUNNER_TEMP/oraculo-evidence-path")"
          bun install --frozen-lockfile 2>&1 | tee "$E/frozen-install.log"

      - name: Focused runtime tests
        run: |
          set -o pipefail
          E="$(cat "$RUNNER_TEMP/oraculo-evidence-path")"
          bun test tests/oracle-single-runtime.test.tsx tests/hardening/h8-architectural-invariants.test.ts tests/hardening/h10-deployment-gate.test.ts 2>&1 | tee "$E/focused-tests.log"

      - name: Global TypeScript zero diagnostics
        run: |
          set -o pipefail
          E="$(cat "$RUNNER_TEMP/oraculo-evidence-path")"
          bunx tsc --noEmit --pretty false 2>&1 | tee "$E/typescript-global.log"
          count="$(grep -cE 'error TS[0-9]+:' "$E/typescript-global.log" || true)"
          echo "global_diagnostics=$count" | tee "$E/typescript-summary.txt"
          test "$count" = "0"

      - name: Global lint zero errors
        run: |
          set -o pipefail
          E="$(cat "$RUNNER_TEMP/oraculo-evidence-path")"
          bun run lint 2>&1 | tee "$E/lint-global.log"

      - name: Full suite zero failures
        run: |
          set -o pipefail
          E="$(cat "$RUNNER_TEMP/oraculo-evidence-path")"
          bun test 2>&1 | tee "$E/full-suite.log"
          failures="$(grep -cE '^\(fail\)' "$E/full-suite.log" || true)"
          echo "candidate_failure_count=$failures" | tee "$E/full-suite-summary.txt"
          test "$failures" = "0"

      - name: Next build
        run: |
          set -o pipefail
          E="$(cat "$RUNNER_TEMP/oraculo-evidence-path")"
          bun run build 2>&1 | tee "$E/next-build.log"

      - name: OpenNext build
        run: |
          set -o pipefail
          E="$(cat "$RUNNER_TEMP/oraculo-evidence-path")"
          bunx opennextjs-cloudflare build 2>&1 | tee "$E/opennext-build.log"

      - name: Verify OpenNext worker
        run: |
          set -euo pipefail
          E="$(cat "$RUNNER_TEMP/oraculo-evidence-path")"
          test -f .open-next/worker.js
          sha256sum .open-next/worker.js > "$E/worker-js.sha256"

      - name: Generate cron wrapper
        run: |
          set -o pipefail
          E="$(cat "$RUNNER_TEMP/oraculo-evidence-path")"
          node scripts/wrap-worker-with-cron.mjs 2>&1 | tee "$E/cron-wrapper.log"

      - name: Verify wrapped worker
        run: |
          set -euo pipefail
          E="$(cat "$RUNNER_TEMP/oraculo-evidence-path")"
          test -f .open-next/worker-with-cron.js
          grep -q '/api/oracle/cron' .open-next/worker-with-cron.js
          grep -q 'persistence_ack' .open-next/worker-with-cron.js
          sha256sum .open-next/worker-with-cron.js > "$E/worker-with-cron.sha256"

      - name: Hardening suite
        run: |
          set -o pipefail
          E="$(cat "$RUNNER_TEMP/oraculo-evidence-path")"
          HARDENING_REPORT_PATH="$E/HARDENING_REPORT.json" node scripts/hardening/run-all.mjs 2>&1 | tee "$E/hardening-suite.log"
          grep -q '"final_gate": "GREEN"' "$E/HARDENING_REPORT.json"

      - name: Final integrity checks
        run: |
          set -euo pipefail
          E="$(cat "$RUNNER_TEMP/oraculo-evidence-path")"
          git diff --check "$ORDER_2_BASE_SHA...HEAD" | tee "$E/diff-check.log"
          git diff --quiet "$ORDER_2_BASE_SHA...HEAD" -- package.json bun.lock
          git diff --quiet "$ORDER_2_BASE_SHA...HEAD" -- src/lib/paper-broker.ts src/app/api/paper-broker/route.ts tests/paper-broker-risk.test.ts
          grep -q '"main": ".open-next/worker-with-cron.js"' wrangler.jsonc
          grep -q 'santaninverter-oracle/\*\*' tsconfig.json
          grep -q 'src/worker.ts' tsconfig.json
          sha256sum package.json bun.lock > "$E/package-hashes-after.txt"
          cmp -s "$E/package-hashes-before.txt" "$E/package-hashes-after.txt"
          rm -rf .next .open-next
          test -z "$(git status --porcelain)"

      - name: Write evidence checksums
        if: always()
        run: |
          set -euo pipefail
          E="$(cat "$RUNNER_TEMP/oraculo-evidence-path")"
          find "$E" -maxdepth 1 -type f ! -name checksums.sha256 -print0 | sort -z | xargs -0 sha256sum > "$E/checksums.sha256"

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oraculo-runtime-gate-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/oraculo-runtime-gate/
          if-no-files-found: error
          retention-days: 14

  production-deploy:
    name: Cloudflare production exact-SHA verification
    needs: runtime-gate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/oraculo-santander-completion-sol' && needs.runtime-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_URL: https://santaninverter-oracle.simondalmasso44.workers.dev
    steps:
      - name: Checkout exact green source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Verify source and PAPER/$0 invariants
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          grep -q '"main": ".open-next/worker-with-cron.js"' wrangler.jsonc
          test "$(python3 -c 'import json; print(json.load(open("wrangler.jsonc"))["name"])')" = "santaninverter-oracle"
          git diff --quiet "$ORDER_2_BASE_SHA...HEAD" -- src/lib/paper-broker.ts src/app/api/paper-broker/route.ts tests/paper-broker-risk.test.ts
          mkdir -p deployment-evidence
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "runtime_gate_run=${{ github.run_id }}"
            echo "incremental_cost_usd=0"
            echo "paper_only=true"
            echo "card_data_used=false"
          } > deployment-evidence/manifest.txt

      - name: Setup Node 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Frozen install and exact-tree rebuild
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx tsc --noEmit --pretty false
          bun run lint
          bun test
          bun run build
          bunx opennextjs-cloudflare build
          node scripts/wrap-worker-with-cron.mjs
          test -f .open-next/worker-with-cron.js
          sha256sum .open-next/worker-with-cron.js > deployment-evidence/worker-with-cron.sha256

      - name: Verify Cloudflare credentials without exposing them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          bunx wrangler whoami > deployment-evidence/wrangler-whoami.txt

      - name: Capture rollback anchor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          WORKER_NAME="$(python3 -c 'import json; print(json.load(open("wrangler.jsonc"))["name"])')"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments"
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$API" > deployment-evidence/deployments-before.json
          python3 -c 'import json; d=json.load(open("deployment-evidence/deployments-before.json")); assert d.get("success") is True'

      - name: Deploy exact candidate to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          bunx wrangler deploy --config wrangler.jsonc 2>&1 | tee deployment-evidence/wrangler-deploy.txt

      - name: Capture deployed version and traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          WORKER_NAME="$(python3 -c 'import json; print(json.load(open("wrangler.jsonc"))["name"])')"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments"
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$API" > deployment-evidence/deployments-after.json
          python3 -c 'import json; d=json.load(open("deployment-evidence/deployments-after.json")); assert d.get("success") is True'

      - name: Production smoke and canonical cron persistence verification
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "$BASE_URL/" -o deployment-evidence/home.html
          curl --fail-with-body --silent --show-error "$BASE_URL/api/oracle/single" -o deployment-evidence/oracle-single.json
          python3 -c 'import json; d=json.load(open("deployment-evidence/oracle-single.json")); assert d.get("success") is True and d.get("status") in ("READY","PARTIAL"); assert isinstance(d.get("macro",{}).get("fieldProvenance"), list)'
          curl --fail-with-body --silent --show-error "$BASE_URL/api/oracle/cron" -o deployment-evidence/cron-health.json
          python3 -c 'import json; d=json.load(open("deployment-evidence/cron-health.json")); assert d.get("success") is True and d.get("mode") == "READ_ONLY_HEALTH"; b=d.get("bindings",{}); assert b.get("fci") and b.get("assets") and b.get("predictions")'
          curl --fail-with-body --silent --show-error -X POST "$BASE_URL/api/oracle/cron" -o deployment-evidence/cron-execution.json
          python3 -c 'import json; d=json.load(open("deployment-evidence/cron-execution.json")); assert d.get("success") is True; assert d.get("lifecycle",{}).get("storage") == "durable"; jobs=d.get("jobs",[]); assert jobs and all(j.get("ok") is True and j.get("persistence_ack",{}).get("durable") is True for j in jobs)'

      - name: Production contract assertions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('deployment-evidence/oracle-single.json'))
          learning=d.get('learning',{})
          assert learning.get('status') in ('READY','NO_HISTORY')
          if learning.get('status') == 'NO_HISTORY':
              assert learning.get('sampleCount') == 0
              assert learning.get('mean_absolute_error') is None
              assert learning.get('directional_accuracy_rate') is None
              assert learning.get('mean_brier_score') is None
          assert d.get('lifecycle',{}).get('storage') == 'durable'
          assert d.get('telemetryStorage',{}).get('state') == 'durable'
          PY
          ! grep -Eqi 'SECRET_INTERNAL_DETAIL|stack trace|/home/runner/' deployment-evidence/oracle-single.json
          printf '%s\n' "traffic_state=production" "production_smoke=PASS" "production_cron=PASS" "production_errors=0_observed" > deployment-evidence/production-summary.txt

      - name: Evidence checksums
        if: always()
        run: |
          set -euo pipefail
          find deployment-evidence -maxdepth 1 -type f ! -name checksums.sha256 -print0 | sort -z | xargs -0 sha256sum > deployment-evidence/checksums.sha256

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oraculo-production-deploy-${{ env.EXPECTED_SHA }}
          path: deployment-evidence/
          if-no-files-found: error
          retention-days: 30
